
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Pelit</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080d08;
  color: #39ff72;
  font-family: monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.container {
  padding: 30px 20px;
  max-width: 600px;
  width: 100%;
}

h1 {
  font-size: clamp(36px, 8vw, 65px);
  letter-spacing: 8px;
  text-shadow: 0 0 15px #39ff72;
  margin-bottom: 10px;
}

.subtitle {
  color: #a0cfa9;
  font-size: 15px;
  margin-bottom: 50px;
}

.game-card {
  border: 1px solid #39ff72;
  padding: 30px 20px;
  box-shadow: 0 0 20px #39ff7222;
}

.game-card h2 {
  font-size: 26px;
  margin-top: 0;
}

.game-card p {
  color: #a0cfa9;
  line-height: 1.6;
}

a {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 35px;
  background: #39ff72;
  color: #001b08;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  transition: 0.2s;
}

a:hover {
  background: white;
  box-shadow: 0 0 20px #39ff72;
}

footer {
  margin-top: 50px;
  color: #55755c;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

  <h1>RETRO<br>PELI</h1>

  <p class="subtitle">
    Tervetuloa pelaamaan PinKiPonKi peliä!
  </p>

  <div class="game-card">
    <h2>🕹️ PinKiPonKi</h2>

    <p>
      Klassinen arcade peli.<br>
      Haasta Kari pingiksessä! Ensimmäinen jolla on 5 pistettä voittaa! Onnea kisaan!
    </p>

    <a href="pong.html">Pelaa Nyt!</a>
  </div>

  <footer>
    Syötä kolikko<br>
    © 2026 Sairio Games
  </footer>

</div>

</body>
</html>
